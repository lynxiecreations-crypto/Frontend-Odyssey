<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waveform — Local Music Player</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:30px 16px;
    font-family:'Segoe UI', system-ui, sans-serif; color:#eef;
    background:linear-gradient(160deg,#1a1030,#0d0818);
  }
  h1{ margin:0 0 4px; font-size:22px; letter-spacing:.02em;
    background:linear-gradient(90deg,#a78bfa,#f472b6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p.sub{ margin:0 0 24px; color:#8888b0; font-size:13.5px; }

  .dropzone{
    width:100%; max-width:560px; border:2px dashed rgba(167,139,250,.35); border-radius:16px;
    padding:24px; text-align:center; cursor:pointer; margin-bottom:20px;
  }
  .dropzone:hover, .dropzone.drag{ border-color:#a78bfa; background:rgba(167,139,250,.05); }
  .dropzone p{ margin:0; color:#a8a8d0; font-size:13.5px; }
  input[type=file]{ display:none; }

  .player{
    width:100%; max-width:560px; background:rgba(255,255,255,.04); border:1px solid rgba(167,139,250,.15);
    border-radius:20px; padding:24px; display:none;
  }
  .player.show{ display:block; }
  canvas{ width:100%; height:140px; display:block; border-radius:12px; background:#08050f; margin-bottom:18px; }
  .track-name{ font-size:15px; font-weight:600; margin-bottom:14px; text-align:center; word-break:break-word; }
  .transport{ display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:18px; }
  .transport button{
    background:none; border:none; color:#eef; font-size:20px; cursor:pointer; opacity:.85;
  }
  .transport button:hover{ opacity:1; }
  .transport .play{
    width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,#a78bfa,#f472b6);
    display:flex; align-items:center; justify-content:center; font-size:18px; color:#0d0818;
  }
  .seek-row{ display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .seek-row span{ font-size:11.5px; color:#8888b0; font-variant-numeric:tabular-nums; }
  input[type=range]{ accent-color:#a78bfa; }
  .seek-row input{ flex:1; }

  .eq{ display:flex; justify-content:space-between; gap:10px; }
  .eq-band{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .eq-band input[type=range]{
    writing-mode:vertical-lr; direction:rtl; width:6px; height:90px;
  }
  .eq-band label{ font-size:10.5px; color:#8888b0; }
  .playlist{ margin-top:20px; max-height:160px; overflow-y:auto; }
  .track-item{
    display:flex; justify-content:space-between; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13px;
  }
  .track-item:hover{ background:rgba(255,255,255,.06); }
  .track-item.active{ background:rgba(167,139,250,.15); }
</style>
</head>
<body>
  <h1>WAVEFORM</h1>
  <p class="sub">A local audio player with a real-time visualizer and 3-band equalizer. Your files never leave your browser.</p>

  <label class="dropzone" id="dropzone" for="fileInput">
    <p>🎵 Drag audio files here, or click to choose (MP3, WAV, OGG...)</p>
  </label>
  <input type="file" id="fileInput" accept="audio/*" multiple>

  <div class="player" id="player">
    <canvas id="visualizer" width="600" height="140"></canvas>
    <div class="track-name" id="trackName">No track loaded</div>

    <div class="transport">
      <button id="prevBtn">⏮</button>
      <button class="play" id="playBtn">▶</button>
      <button id="nextBtn">⏭</button>
    </div>

    <div class="seek-row">
      <span id="curTime">0:00</span>
      <input type="range" id="seekBar" min="0" max="100" value="0">
      <span id="durTime">0:00</span>
    </div>

    <div class="eq">
      <div class="eq-band"><input type="range" id="eqLow" min="-20" max="20" value="0"><label>Bass</label></div>
      <div class="eq-band"><input type="range" id="eqMid" min="-20" max="20" value="0"><label>Mid</label></div>
      <div class="eq-band"><input type="range" id="eqHigh" min="-20" max="20" value="0"><label>Treble</label></div>
      <div class="eq-band"><input type="range" id="volumeCtl" min="0" max="100" value="80"><label>Volume</label></div>
    </div>

    <div class="playlist" id="playlist"></div>
  </div>

  <audio id="audioEl" crossorigin="anonymous"></audio>

<script>
(function(){
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const audioEl = document.getElementById('audioEl');
  const player = document.getElementById('player');
  const canvas = document.getElementById('visualizer');
  const ctx = canvas.getContext('2d');

  let playlist = [];
  let currentIndex = 0;
  let audioCtx, analyser, sourceNode, lowFilter, midFilter, highFilter, gainNode;
  let rafId;

  ['dragover','dragleave','drop'].forEach(evt=>{
    dropzone.addEventListener(evt, (e)=>{
      e.preventDefault();
      dropzone.classList.toggle('drag', evt==='dragover');
    });
  });
  dropzone.addEventListener('drop', (e)=> handleFiles(e.dataTransfer.files));
  fileInput.addEventListener('change', (e)=> handleFiles(e.target.files));

  function handleFiles(files){
    Array.from(files).forEach(f=>{
      if(f.type.startsWith('audio/')){
        playlist.push({ name: f.name, url: URL.createObjectURL(f) });
      }
    });
    renderPlaylist();
    if(playlist.length && !player.classList.contains('show')){
      loadTrack(0);
      player.classList.add('show');
    }
  }

  function renderPlaylist(){
    const el = document.getElementById('playlist');
    el.innerHTML = '';
    playlist.forEach((t,i)=>{
      const div = document.createElement('div');
      div.className = 'track-item' + (i===currentIndex ? ' active':'');
      div.textContent = t.name;
      div.addEventListener('click', ()=>{ loadTrack(i); play(); });
      el.appendChild(div);
    });
  }

  function setupAudioGraph(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaElementSource(audioEl);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;

    lowFilter = audioCtx.createBiquadFilter(); lowFilter.type='lowshelf'; lowFilter.frequency.value=320;
    midFilter = audioCtx.createBiquadFilter(); midFilter.type='peaking'; midFilter.frequency.value=1000; midFilter.Q.value=0.8;
    highFilter = audioCtx.createBiquadFilter(); highFilter.type='highshelf'; highFilter.frequency.value=3200;
    gainNode = audioCtx.createGain();

    sourceNode.connect(lowFilter);
    lowFilter.connect(midFilter);
    midFilter.connect(highFilter);
    highFilter.connect(gainNode);
    gainNode.connect(analyser);
    analyser.connect(audioCtx.destination);

    gainNode.gain.value = Number(document.getElementById('volumeCtl').value)/100;
  }

  function loadTrack(i){
    currentIndex = (i+playlist.length)%playlist.length;
    audioEl.src = playlist[currentIndex].url;
    document.getElementById('trackName').textContent = playlist[currentIndex].name;
    renderPlaylist();
  }

  function play(){
    setupAudioGraph();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    audioEl.play();
  }
  function pause(){ audioEl.pause(); }

  document.getElementById('playBtn').addEventListener('click', ()=>{
    if(audioEl.paused) play(); else pause();
  });
  audioEl.addEventListener('play', ()=>{ document.getElementById('playBtn').textContent='⏸'; drawViz(); });
  audioEl.addEventListener('pause', ()=>{ document.getElementById('playBtn').textContent='▶'; });
  audioEl.addEventListener('ended', ()=> loadNext());

  document.getElementById('nextBtn').addEventListener('click', loadNext);
  document.getElementById('prevBtn').addEventListener('click', ()=>{ loadTrack(currentIndex-1); play(); });
  function loadNext(){ loadTrack(currentIndex+1); play(); }

  audioEl.addEventListener('timeupdate', ()=>{
    if(!audioEl.duration) return;
    document.getElementById('seekBar').value = (audioEl.currentTime/audioEl.duration)*100;
    document.getElementById('curTime').textContent = fmt(audioEl.currentTime);
    document.getElementById('durTime').textContent = fmt(audioEl.duration);
  });
  document.getElementById('seekBar').addEventListener('input', (e)=>{
    if(audioEl.duration) audioEl.currentTime = (e.target.value/100)*audioEl.duration;
  });

  function fmt(s){ const m=Math.floor(s/60), sec=Math.floor(s%60).toString().padStart(2,'0'); return `${m}:${sec}`; }

  document.getElementById('eqLow').addEventListener('input', (e)=>{ if(lowFilter) lowFilter.gain.value = Number(e.target.value); });
  document.getElementById('eqMid').addEventListener('input', (e)=>{ if(midFilter) midFilter.gain.value = Number(e.target.value); });
  document.getElementById('eqHigh').addEventListener('input', (e)=>{ if(highFilter) highFilter.gain.value = Number(e.target.value); });
  document.getElementById('volumeCtl').addEventListener('input', (e)=>{ if(gainNode) gainNode.gain.value = Number(e.target.value)/100; });

  function drawViz(){
    if(audioEl.paused){ cancelAnimationFrame(rafId); return; }
    rafId = requestAnimationFrame(drawViz);
    if(!analyser) return;
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteFrequencyData(dataArray);
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = '#08050f';
    ctx.fillRect(0,0,w,h);
    const barWidth = (w/bufferLength)*2.4;
    let x=0;
    for(let i=0;i<bufferLength;i++){
      const v = dataArray[i]/255;
      const barHeight = v*h*0.9;
      const hue = 260 + (i/bufferLength)*80;
      ctx.fillStyle = `hsl(${hue},80%,65%)`;
      ctx.fillRect(x, h-barHeight, barWidth, barHeight);
      x += barWidth+2;
    }
  }

  // idle shimmer when nothing is playing
  function idleShimmer(){
    if(!audioEl.paused) return;
    ctx.fillStyle = 'rgba(8,5,15,0.15)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    requestAnimationFrame(idleShimmer);
  }
  ctx.fillStyle = '#08050f';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  idleShimmer();
})();
</script>
</body>
</html>
