<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault — Password Generator</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    font-family:'Consolas','Courier New',monospace;
    background:#07070c; color:#e8e8f5;
  }
  #bg{ position:fixed; inset:0; z-index:0; opacity:.5; }
  .card{
    position:relative; z-index:1; width:100%; max-width:440px; background:#0e0e17;
    border:1px solid #23233a; border-radius:20px; padding:30px 28px;
    box-shadow:0 0 60px rgba(122,92,255,.08);
  }
  h1{ margin:0 0 4px; font-size:21px; letter-spacing:.02em; color:#a78bfa; }
  p.sub{ margin:0 0 24px; color:#6c6c8a; font-size:13px; }
  .output{
    display:flex; gap:8px; margin-bottom:20px;
  }
  .output input{
    flex:1; padding:14px 16px; border-radius:12px; border:1px solid #2b2b45; background:#050509;
    color:#7effc7; font-size:16px; font-family:inherit; letter-spacing:.03em;
  }
  .output button{
    padding:0 18px; border-radius:12px; border:1px solid #2b2b45; background:#171727; color:#a78bfa;
    cursor:pointer; font-size:16px;
  }
  .output button:hover{ background:#20203a; }
  .strength{ margin-bottom:22px; }
  .bars{ display:flex; gap:6px; margin-bottom:6px; }
  .bars span{ flex:1; height:6px; border-radius:4px; background:#23233a; }
  .strength-label{ font-size:12.5px; color:#6c6c8a; }
  .options label{
    display:flex; justify-content:space-between; align-items:center; font-size:13.5px; color:#c8c8dc;
    padding:10px 0; border-bottom:1px solid #1a1a2c;
  }
  .options input[type=range]{ width:130px; accent-color:#a78bfa; }
  input[type=checkbox]{ width:18px; height:18px; accent-color:#a78bfa; }
  button.generate{
    width:100%; margin-top:22px; padding:14px; border:none; border-radius:12px; cursor:pointer;
    background:linear-gradient(135deg,#7c5cff,#a78bfa); color:#050509; font-weight:700; font-family:inherit; font-size:14.5px;
  }
  button.generate:hover{ filter:brightness(1.1); }
  .copied-toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#a78bfa; color:#050509; padding:9px 18px; border-radius:8px; font-size:13px; font-weight:700;
    opacity:0; transition:opacity .2s; z-index:3;
  }
  .copied-toast.show{ opacity:1; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main class="card">
  <h1>VAULT://</h1>
  <p class="sub">Generate strong, random passwords. Nothing leaves your browser.</p>

  <div class="output">
    <input type="text" id="passOutput" readonly>
    <button id="copyBtn" title="Copy">📋</button>
  </div>

  <div class="strength">
    <div class="bars" id="bars">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="strength-label" id="strengthLabel">Strength: —</div>
  </div>

  <div class="options">
    <label>Length <input type="range" id="lengthSlider" min="6" max="32" value="16"><span id="lengthVal">16</span></label>
    <label>Uppercase (A-Z) <input type="checkbox" id="upper" checked></label>
    <label>Lowercase (a-z) <input type="checkbox" id="lower" checked></label>
    <label>Numbers (0-9) <input type="checkbox" id="numbers" checked></label>
    <label>Symbols (!@#$) <input type="checkbox" id="symbols" checked></label>
  </div>

  <button class="generate" id="generateBtn">↻ Generate new password</button>
</main>
<div class="copied-toast" id="toast">Copied to clipboard!</div>

<script>
(function(){
  const sets = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    numbers: '0123456789',
    symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
  };

  const output = document.getElementById('passOutput');
  const lengthSlider = document.getElementById('lengthSlider');
  const lengthVal = document.getElementById('lengthVal');
  const bars = document.querySelectorAll('#bars span');
  const strengthLabel = document.getElementById('strengthLabel');

  function generate(){
    const len = Number(lengthSlider.value);
    let pool = '';
    if(document.getElementById('upper').checked) pool += sets.upper;
    if(document.getElementById('lower').checked) pool += sets.lower;
    if(document.getElementById('numbers').checked) pool += sets.numbers;
    if(document.getElementById('symbols').checked) pool += sets.symbols;
    if(!pool){ output.value = 'Select at least one character type'; return; }

    const array = new Uint32Array(len);
    crypto.getRandomValues(array);
    let pass = '';
    for(let i=0;i<len;i++){ pass += pool[array[i] % pool.length]; }
    output.value = pass;
    updateStrength(pass, len);
  }

  function updateStrength(pass, len){
    let score = 0;
    if(/[a-z]/.test(pass)) score++;
    if(/[A-Z]/.test(pass)) score++;
    if(/[0-9]/.test(pass)) score++;
    if(/[^a-zA-Z0-9]/.test(pass)) score++;
    if(len >= 12) score++;
    if(len >= 20) score++;

    const level = Math.min(4, Math.ceil(score/1.5));
    const colors = ['#ff5c5c','#ff9c5c','#ffd25c','#7effc7'];
    const labels = ['Weak','Fair','Good','Strong'];
    bars.forEach((b,i)=>{
      b.style.background = i < level ? colors[level-1] : '#23233a';
    });
    strengthLabel.textContent = `Strength: ${labels[level-1] || 'Weak'}`;
  }

  lengthSlider.addEventListener('input', ()=>{
    lengthVal.textContent = lengthSlider.value;
    generate();
  });
  document.querySelectorAll('.options input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', generate);
  });
  document.getElementById('generateBtn').addEventListener('click', generate);

  document.getElementById('copyBtn').addEventListener('click', ()=>{
    navigator.clipboard?.writeText(output.value);
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 1200);
  });

  // lively subtle particle background
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  window.addEventListener('resize', resize); resize();
  const dots = Array.from({length:60}, ()=>({
    x:Math.random()*canvas.width, y:Math.random()*canvas.height,
    vx:(Math.random()-.5)*.3, vy:(Math.random()-.5)*.3, r:Math.random()*1.5+.5
  }));
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    dots.forEach(d=>{
      d.x+=d.vx; d.y+=d.vy;
      if(d.x<0||d.x>canvas.width) d.vx*=-1;
      if(d.y<0||d.y>canvas.height) d.vy*=-1;
      ctx.beginPath();
      ctx.fillStyle='rgba(167,139,250,.5)';
      ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();

  generate();
})();
</script>
</body>
</html>
