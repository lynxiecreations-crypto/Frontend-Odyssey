<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split — Tip & Bill Calculator</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    font-family:'Segoe UI', system-ui, sans-serif;
    background:linear-gradient(160deg,#0b3d2e,#0f5c42 55%,#137a53);
    color:#eafff2;
  }
  .card{
    width:100%; max-width:420px; background:rgba(255,255,255,.06); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.12); border-radius:22px; padding:30px 28px;
  }
  h1{ margin:0 0 4px; font-size:22px; }
  p.sub{ margin:0 0 24px; color:#9fe0bd; font-size:13.5px; }
  label{ display:block; font-size:12.5px; color:#9fe0bd; margin-bottom:6px; }
  .field{ margin-bottom:18px; }
  input[type=number]{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.2); color:#eafff2; font-size:17px; font-family:inherit; outline:none;
  }
  input:focus{ border-color:#3ee08f; }
  .tip-options{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .tip-options button{
    flex:1; min-width:60px; padding:11px 0; border-radius:10px; border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05); color:#eafff2; cursor:pointer; font-family:inherit; font-size:14px;
  }
  .tip-options button.active{ background:#3ee08f; color:#062818; font-weight:700; border-color:#3ee08f; }
  .stepper{ display:flex; align-items:center; gap:14px; }
  .stepper button{
    width:38px; height:38px; border-radius:50%; border:none; background:rgba(255,255,255,.1);
    color:#eafff2; font-size:18px; cursor:pointer;
  }
  .stepper button:hover{ background:rgba(255,255,255,.2); }
  .stepper .count{ font-size:20px; font-weight:700; min-width:30px; text-align:center; }
  .results{
    margin-top:24px; background:rgba(0,0,0,.2); border-radius:16px; padding:20px;
  }
  .result-row{ display:flex; justify-content:space-between; padding:8px 0; font-size:14.5px; }
  .result-row.total{ border-top:1px solid rgba(255,255,255,.15); margin-top:6px; padding-top:14px; font-size:17px; font-weight:700; color:#3ee08f; }
  .result-row span:last-child{ font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<main class="card">
  <h1>Split</h1>
  <p class="sub">Bill amount, tip, and people — split fairly in one glance.</p>

  <div class="field">
    <label>Bill amount</label>
    <input type="number" id="bill" placeholder="0.00" step="0.01" min="0">
  </div>

  <div class="field">
    <label>Tip percentage</label>
    <div class="tip-options" id="tipOptions">
      <button data-tip="10">10%</button>
      <button data-tip="15" class="active">15%</button>
      <button data-tip="18">18%</button>
      <button data-tip="20">20%</button>
      <button data-tip="25">25%</button>
    </div>
    <input type="number" id="customTip" placeholder="Custom %" min="0" style="margin-top:8px;">
  </div>

  <div class="field">
    <label>Number of people</label>
    <div class="stepper">
      <button id="decrease">−</button>
      <span class="count" id="peopleCount">1</span>
      <button id="increase">+</button>
    </div>
  </div>

  <div class="results">
    <div class="result-row"><span>Tip amount</span><span id="tipAmount">$0.00</span></div>
    <div class="result-row"><span>Total bill</span><span id="totalAmount">$0.00</span></div>
    <div class="result-row total"><span>Per person</span><span id="perPerson">$0.00</span></div>
  </div>
</main>

<script>
(function(){
  let tipPercent = 15;
  let people = 1;

  const billInput = document.getElementById('bill');
  const customTip = document.getElementById('customTip');
  const tipOptions = document.getElementById('tipOptions');

  function fmt(n){ return '$' + n.toFixed(2); }

  function calculate(){
    const bill = parseFloat(billInput.value) || 0;
    const tipAmt = bill * (tipPercent/100);
    const total = bill + tipAmt;
    const per = total / Math.max(1,people);
    document.getElementById('tipAmount').textContent = fmt(tipAmt);
    document.getElementById('totalAmount').textContent = fmt(total);
    document.getElementById('perPerson').textContent = fmt(per);
  }

  tipOptions.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    document.querySelectorAll('.tip-options button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    tipPercent = Number(btn.dataset.tip);
    customTip.value = '';
    calculate();
  });

  customTip.addEventListener('input', ()=>{
    if(customTip.value){
      document.querySelectorAll('.tip-options button').forEach(b=>b.classList.remove('active'));
      tipPercent = Number(customTip.value) || 0;
      calculate();
    }
  });

  document.getElementById('increase').addEventListener('click', ()=>{
    people++;
    document.getElementById('peopleCount').textContent = people;
    calculate();
  });
  document.getElementById('decrease').addEventListener('click', ()=>{
    people = Math.max(1, people-1);
    document.getElementById('peopleCount').textContent = people;
    calculate();
  });

  billInput.addEventListener('input', calculate);
  calculate();
})();
</script>
</body>
</html>
