<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scribe — Markdown Live Editor</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; height:100vh; display:flex; flex-direction:column;
    font-family:'Segoe UI', system-ui, sans-serif; background:#1a1c24; color:#dcdfe8;
  }
  header{
    display:flex; align-items:center; justify-content:space-between; padding:14px 22px;
    border-bottom:1px solid #2a2d38;
  }
  header h1{ font-size:15px; margin:0; letter-spacing:.04em; color:#8ab4ff; }
  header .actions{ display:flex; gap:10px; }
  header button{
    font-family:inherit; font-size:12.5px; padding:8px 14px; border-radius:8px; cursor:pointer;
    background:#252836; color:#dcdfe8; border:1px solid #363a4a;
  }
  header button:hover{ background:#2f3344; }
  .panes{ flex:1; display:flex; min-height:0; }
  .pane{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .pane + .pane{ border-left:1px solid #2a2d38; }
  .pane-label{ font-size:11px; letter-spacing:.08em; color:#5c6178; padding:10px 18px; text-transform:uppercase; }
  textarea{
    flex:1; border:none; outline:none; resize:none; background:transparent; color:#dcdfe8;
    font-family:'Consolas','Courier New',monospace; font-size:14.5px; line-height:1.7; padding:0 18px 18px;
  }
  .preview{
    flex:1; overflow-y:auto; padding:0 22px 22px; font-size:15px; line-height:1.7;
  }
  .preview h1,.preview h2,.preview h3{ color:#f0f2f8; }
  .preview code{
    background:#252836; padding:2px 6px; border-radius:4px; font-family:'Consolas',monospace; font-size:.9em;
  }
  .preview pre{
    background:#12141a; padding:14px 16px; border-radius:10px; overflow-x:auto; border:1px solid #2a2d38;
  }
  .preview pre code{ background:none; padding:0; }
  .preview blockquote{
    border-left:3px solid #8ab4ff; margin:0; padding:4px 0 4px 16px; color:#a6adc4;
  }
  .preview a{ color:#8ab4ff; }
  .preview ul, .preview ol{ padding-left:22px; }
  .preview table{ border-collapse:collapse; width:100%; margin:12px 0; }
  .preview th, .preview td{ border:1px solid #2a2d38; padding:8px 12px; text-align:left; }
  .preview img{ max-width:100%; border-radius:8px; }
  @media (max-width:760px){ .panes{ flex-direction:column; } .pane + .pane{ border-left:none; border-top:1px solid #2a2d38; } }
</style>
</head>
<body>
<header>
  <h1>SCRIBE — Markdown Live Editor</h1>
  <div class="actions">
    <button id="downloadMd">⬇ .md</button>
    <button id="downloadHtml">⬇ .html</button>
    <button id="clearBtn">Clear</button>
  </div>
</header>

<div class="panes">
  <div class="pane">
    <div class="pane-label">Write</div>
    <textarea id="editor" spellcheck="false"></textarea>
  </div>
  <div class="pane">
    <div class="pane-label">Preview</div>
    <div class="preview" id="preview"></div>
  </div>
</div>

<script>
(function(){
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const STORAGE_KEY = 'scribe-markdown-content';

  const defaultText = `# Welcome to Scribe

A tiny, dependency-free markdown editor. Type on the left, see it rendered on the right — instantly.

## Features

- **Bold**, *italic*, and \`inline code\`
- Lists, like this one
- > Blockquotes for emphasis
- Links: [Example](https://example.com)
- Fenced code blocks:

\`\`\`
function hello() {
  console.log("Hello, Scribe!");
}
\`\`\`

Your work saves automatically in this browser, so you can close the tab and come back later.
`;

  // ---- Minimal markdown parser (subset, dependency-free) ----
  function escapeHtml(str){
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderMarkdown(md){
    const lines = md.split('\n');
    let html = '';
    let inCode = false;
    let codeBuffer = [];
    let listBuffer = [];
    let listType = null;

    function flushList(){
      if(listBuffer.length){
        const tag = listType === 'ol' ? 'ol' : 'ul';
        html += `<${tag}>${listBuffer.map(li=>`<li>${inline(li)}</li>`).join('')}</${tag}>`;
        listBuffer = []; listType = null;
      }
    }

    function inline(text){
      text = escapeHtml(text);
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      return text;
    }

    lines.forEach(line=>{
      if(line.trim().startsWith('```')){
        if(inCode){
          html += `<pre><code>${escapeHtml(codeBuffer.join('\n'))}</code></pre>`;
          codeBuffer = []; inCode = false;
        } else {
          flushList();
          inCode = true;
        }
        return;
      }
      if(inCode){ codeBuffer.push(line); return; }

      if(/^#{1,6}\s/.test(line)){
        flushList();
        const level = line.match(/^#+/)[0].length;
        html += `<h${level}>${inline(line.replace(/^#+\s/, ''))}</h${level}>`;
      } else if(/^>\s?/.test(line)){
        flushList();
        html += `<blockquote>${inline(line.replace(/^>\s?/, ''))}</blockquote>`;
      } else if(/^[-*]\s/.test(line)){
        if(listType !== 'ul') flushList();
        listType = 'ul';
        listBuffer.push(line.replace(/^[-*]\s/, ''));
      } else if(/^\d+\.\s/.test(line)){
        if(listType !== 'ol') flushList();
        listType = 'ol';
        listBuffer.push(line.replace(/^\d+\.\s/, ''));
      } else if(line.trim() === ''){
        flushList();
      } else {
        flushList();
        html += `<p>${inline(line)}</p>`;
      }
    });
    flushList();
    if(inCode) html += `<pre><code>${escapeHtml(codeBuffer.join('\n'))}</code></pre>`;
    return html;
  }

  function update(){
    preview.innerHTML = renderMarkdown(editor.value);
    localStorage.setItem(STORAGE_KEY, editor.value);
  }

  editor.addEventListener('input', update);

  document.getElementById('downloadMd').addEventListener('click', ()=>{
    downloadFile(editor.value, 'document.md', 'text/markdown');
  });
  document.getElementById('downloadHtml').addEventListener('click', ()=>{
    const fullHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Document</title></head><body>${preview.innerHTML}</body></html>`;
    downloadFile(fullHtml, 'document.html', 'text/html');
  });
  document.getElementById('clearBtn').addEventListener('click', ()=>{
    if(confirm('Clear all content?')){ editor.value=''; update(); }
  });

  function downloadFile(content, filename, type){
    const blob = new Blob([content], {type});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
  }

  editor.value = localStorage.getItem(STORAGE_KEY) || defaultText;
  update();
})();
</script>
</body>
</html>
