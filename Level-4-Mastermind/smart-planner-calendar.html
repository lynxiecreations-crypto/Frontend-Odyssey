<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner — Weekly Task Calendar</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; padding:30px 20px;
    background:#f6f7fb; color:#1e2333; font-family:'Segoe UI', system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center;
  }
  h1{ margin:0 0 4px; font-size:23px; }
  p.sub{ margin:0 0 22px; color:#6d7794; font-size:13.5px; }

  .toolbar{ display:flex; gap:10px; width:100%; max-width:980px; margin-bottom:16px; }
  .toolbar input{
    flex:1; padding:11px 14px; border-radius:10px; border:1px solid #e2e6f0; font-family:inherit; font-size:14px; outline:none;
  }
  .toolbar input:focus{ border-color:#3a5ccc; }
  .toolbar button{
    padding:0 18px; border:none; border-radius:10px; background:#1e2333; color:#fff; cursor:pointer; font-size:14px;
  }
  .toolbar button:hover{ background:#2c3350; }

  .unscheduled{
    width:100%; max-width:980px; background:#fff; border-radius:14px; padding:14px 16px; margin-bottom:16px;
    box-shadow:0 6px 20px rgba(30,40,70,.05);
  }
  .unscheduled h3{ margin:0 0 10px; font-size:12px; color:#8a92ab; text-transform:uppercase; }
  .unscheduled-list{ display:flex; gap:8px; flex-wrap:wrap; min-height:36px; }
  .task-chip{
    background:#eef1fb; border:1px solid #dbe1f7; border-radius:100px; padding:7px 14px; font-size:13px;
    cursor:grab; display:flex; align-items:center; gap:8px;
  }
  .task-chip .del{ background:none; border:none; color:#a0a8c5; cursor:pointer; font-size:12px; }

  .calendar{
    width:100%; max-width:980px; display:grid; grid-template-columns:repeat(7,1fr); gap:8px;
  }
  .day-col{ background:#fff; border-radius:14px; padding:10px; min-height:220px; box-shadow:0 6px 20px rgba(30,40,70,.05); }
  .day-col.today{ box-shadow:0 0 0 2px #3a5ccc, 0 6px 20px rgba(30,40,70,.05); }
  .day-header{ font-size:11.5px; color:#8a92ab; text-transform:uppercase; margin-bottom:8px; text-align:center; }
  .day-header .num{ display:block; font-size:16px; color:#1e2333; font-weight:700; }
  .day-tasks{ display:flex; flex-direction:column; gap:6px; min-height:40px; }
  .scheduled-task{
    background:#f0f4ff; border:1px solid #dbe1f7; border-radius:8px; padding:7px 9px; font-size:12.5px;
    cursor:grab; display:flex; align-items:center; gap:6px; position:relative;
  }
  .scheduled-task.done{ background:#e6faf0; border-color:#c2f0d8; text-decoration:line-through; color:#5a9a78; }
  .scheduled-task input[type=checkbox]{ margin:0; accent-color:#2ea36b; }
  .scheduled-task .remove{
    position:absolute; top:2px; right:4px; background:none; border:none; color:#b8bfd6; font-size:11px; cursor:pointer;
  }
  @media (max-width:820px){ .calendar{ grid-template-columns:repeat(7,minmax(100px,1fr)); overflow-x:auto; } }
</style>
</head>
<body>
  <h1>Planner</h1>
  <p class="sub">Drag tasks onto the week. Check them off for a satisfying little chime.</p>

  <div class="toolbar">
    <input type="text" id="taskInput" placeholder="Add a task, then drag it to a day...">
    <button id="addBtn">+ Add task</button>
  </div>

  <div class="unscheduled">
    <h3>Unscheduled</h3>
    <div class="unscheduled-list" id="unscheduledList"></div>
  </div>

  <div class="calendar" id="calendar"></div>

<script>
(function(){
  const KEY = 'planner-data';
  let data = JSON.parse(localStorage.getItem(KEY) || 'null') || { unscheduled: [
    { id:1, text:'Review pull requests', done:false },
    { id:2, text:'Plan weekend trip', done:false }
  ], days: {} }; // days: { "0": [taskIds by weekday offset] } -> we store actual date keys
  let nextId = 3;

  function save(){ localStorage.setItem(KEY, JSON.stringify(data)); }

  function weekDates(){
    const now = new Date();
    const dayOfWeek = now.getDay(); // 0=Sun
    const monday = new Date(now);
    monday.setDate(now.getDate() - ((dayOfWeek+6)%7)); // start week on Monday
    return Array.from({length:7}, (_,i)=>{
      const d = new Date(monday);
      d.setDate(monday.getDate()+i);
      return d;
    });
  }

  function dateKey(d){ return d.toISOString().slice(0,10); }
  function isToday(d){ return dateKey(d) === dateKey(new Date()); }

  function allTasks(){
    const map = {};
    data.unscheduled.forEach(t=> map[t.id]=t);
    Object.values(data.days).forEach(list=> list.forEach(t=> map[t.id]=t));
    return map;
  }

  function renderUnscheduled(){
    const el = document.getElementById('unscheduledList');
    el.innerHTML = '';
    if(data.unscheduled.length === 0){
      el.innerHTML = '<span style="color:#c3c9db; font-size:12.5px;">All tasks scheduled!</span>';
    }
    data.unscheduled.forEach(task=>{
      const chip = document.createElement('div');
      chip.className = 'task-chip';
      chip.draggable = true;
      chip.dataset.id = task.id;
      chip.innerHTML = `<span>${escapeHtml(task.text)}</span><button class="del" data-id="${task.id}">×</button>`;
      chip.addEventListener('dragstart', ()=>{
        chip.dataset.from = 'unscheduled';
        window.__dragId = task.id;
        window.__dragFrom = 'unscheduled';
      });
      chip.querySelector('.del').addEventListener('click', ()=>{
        data.unscheduled = data.unscheduled.filter(t=>t.id!==task.id);
        save(); renderAll();
      });
      el.appendChild(chip);
    });
  }

  function renderCalendar(){
    const calendar = document.getElementById('calendar');
    calendar.innerHTML = '';
    const dates = weekDates();
    dates.forEach(d=>{
      const key = dateKey(d);
      if(!data.days[key]) data.days[key] = [];
      const col = document.createElement('div');
      col.className = 'day-col' + (isToday(d) ? ' today' : '');
      col.innerHTML = `
        <div class="day-header">${d.toLocaleDateString(undefined,{weekday:'short'})}<span class="num">${d.getDate()}</span></div>
        <div class="day-tasks" data-key="${key}"></div>
      `;
      calendar.appendChild(col);

      const tasksEl = col.querySelector('.day-tasks');
      data.days[key].forEach(task=>{
        const div = document.createElement('div');
        div.className = 'scheduled-task' + (task.done ? ' done' : '');
        div.draggable = true;
        div.dataset.id = task.id;
        div.innerHTML = `
          <input type="checkbox" ${task.done?'checked':''}>
          <span>${escapeHtml(task.text)}</span>
          <button class="remove">×</button>
        `;
        div.querySelector('input').addEventListener('change', (e)=>{
          task.done = e.target.checked;
          if(task.done) playChime();
          save(); renderCalendar();
        });
        div.querySelector('.remove').addEventListener('click', ()=>{
          data.days[key] = data.days[key].filter(t=>t.id!==task.id);
          save(); renderCalendar();
        });
        div.addEventListener('dragstart', ()=>{
          window.__dragId = task.id;
          window.__dragFrom = key;
        });
        tasksEl.appendChild(div);
      });

      tasksEl.addEventListener('dragover', (e)=> e.preventDefault());
      tasksEl.addEventListener('drop', (e)=>{
        e.preventDefault();
        moveTask(window.__dragId, window.__dragFrom, key);
      });
    });
  }

  document.getElementById('unscheduledList').addEventListener('dragover', (e)=> e.preventDefault());
  document.getElementById('unscheduledList').addEventListener('drop', (e)=>{
    e.preventDefault();
    moveTask(window.__dragId, window.__dragFrom, 'unscheduled');
  });

  function moveTask(id, from, to){
    if(from === to || id == null) return;
    const map = allTasks();
    const task = map[id];
    if(!task) return;
    if(from === 'unscheduled') data.unscheduled = data.unscheduled.filter(t=>t.id!==id);
    else data.days[from] = data.days[from].filter(t=>t.id!==id);

    if(to === 'unscheduled') data.unscheduled.push(task);
    else { if(!data.days[to]) data.days[to]=[]; data.days[to].push(task); }

    save(); renderAll();
  }

  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

  function renderAll(){ renderUnscheduled(); renderCalendar(); }

  document.getElementById('addBtn').addEventListener('click', addTask);
  document.getElementById('taskInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') addTask(); });
  function addTask(){
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if(!text) return;
    data.unscheduled.push({ id: nextId++, text, done:false });
    input.value = '';
    save(); renderAll();
  }

  // ---------- completion chime (Web Audio, synthesized) ----------
  function playChime(){
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const notes = [660, 880];
      notes.forEach((freq, i)=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        osc.connect(gain); gain.connect(ctx.destination);
        const startAt = ctx.currentTime + i*0.09;
        gain.gain.setValueAtTime(0.001, startAt);
        gain.gain.exponentialRampToValueAtTime(0.18, startAt+0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startAt+0.4);
        osc.start(startAt); osc.stop(startAt+0.45);
      });
    }catch(e){}
  }

  renderAll();
})();
</script>
</body>
</html>
